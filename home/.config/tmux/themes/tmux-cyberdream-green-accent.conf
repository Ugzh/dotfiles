set -g pane-active-border-style 'fg=#00ff9d,bg=default'
set -g pane-border-style 'fg=#1b2630,bg=default'

set -g @floax-border-color '#00ff9d'
set -g @floax-text-color '#d8fff2'

set -g status-style 'bg=#0b0f14,fg=#d8fff2'
set -g status-left '#[bg=#00ff9d,fg=#0b0f14,bold] #S #[bg=#0b0f14,fg=#00ff9d,nobold] '
set -g status-right '#[fg=#58ffc0,bg=#0b0f14] %H:%M '
setw -g window-status-current-style 'bg=#00ff9d,fg=#0b0f14,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'bg=#0b0f14,fg=#7c8b93'
setw -g window-status-format ' #I:#W '
setw -g mode-style 'bg=#25313a,fg=#d8fff2'
