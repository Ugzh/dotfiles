set -g pane-active-border-style 'fg=#00ff9d,bg=default'
set -g pane-border-style 'fg=#123d31,bg=default'

set -g @floax-border-color '#00ff9d'
set -g @floax-text-color '#d8fff2'

set -g status-style 'bg=#071611,fg=#d8fff2'
set -g status-left '#[bg=#00ff9d,fg=#071611,bold] #S #[bg=#071611,fg=#00ff9d,nobold] '
set -g status-right '#[fg=#58ffc0,bg=#071611] %H:%M '
setw -g window-status-current-style 'bg=#00ff9d,fg=#071611,bold'
setw -g window-status-current-format ' #I:#W '
setw -g window-status-style 'bg=#071611,fg=#58ffc0'
setw -g window-status-format ' #I:#W '
setw -g mode-style 'bg=#1b5a46,fg=#d8fff2'
