# Single-line prompt tuned for the Obsidian Rose desktop theme.
add_newline = false
palette = "obsidian_rose"

format = "$directory$git_branch$git_status$nodejs$package$cmd_duration$status$character"

[directory]
format = "[$path]($style) "
style = "bold bright"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[on](fg_dim) [$symbol$branch]($style) "
style = "bold lavender"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold pink"
conflicted = "≠${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = " "
format = "[via](fg_dim) [$symbol($version)]($style) "
style = "bold accent"

[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "fg_dim"

[cmd_duration]
min_time = 2_000
format = "[took](fg_dim) [$duration]($style) "
style = "bold warning"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

[character]
success_symbol = "[❯](bold accent) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold lavender) "
vimcmd_replace_one_symbol = "[❮](bold warning) "
vimcmd_replace_symbol = "[❮](bold warning) "
vimcmd_visual_symbol = "[❮](bold pink) "

[palettes.obsidian_rose]
accent = "#c7f36b"
bright = "#c6a0f6"
lavender = "#bda0ef"
pink = "#f15bb5"
red = "#ff6e9e"
warning = "#e8b4ff"
fg_dim = "#b7a7bd"
