# Generated by apply-theme. Edit starship.toml.tmpl, not starship.toml.
add_newline = true
palette = "desktop"

format = "$directory$git_branch$git_status$nodejs$package$cmd_duration$status$line_break$character"

[directory]
format = "[$path]($style) "
style = "bold bright"
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = " "
format = "[on](fg_dim) [$symbol$branch]($style) "
style = "bold accent"
truncation_length = 32
truncation_symbol = "…"

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold pink"
conflicted = "≠${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "?${count} "
stashed = "󰏗${count} "
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[nodejs]
symbol = " "
format = "[via](fg_dim) [$symbol($version)]($style) "
style = "bold accent"

[package]
symbol = "󰏗 "
format = "[$symbol$version]($style) "
style = "fg_dim"

[cmd_duration]
min_time = 2_000
format = "[took](fg_dim) [$duration]($style) "
style = "bold warning"

[status]
disabled = false
format = "[$symbol$status]($style) "
symbol = "✘ "
style = "bold red"

[character]
success_symbol = "[❯](bold accent) "
error_symbol = "[❯](bold red) "
vimcmd_symbol = "[❮](bold bright) "
vimcmd_replace_one_symbol = "[❮](bold warning) "
vimcmd_replace_symbol = "[❮](bold warning) "
vimcmd_visual_symbol = "[❮](bold pink) "

[palettes.desktop]
accent = "#cba6f7"
bright = "#b4befe"
pink = "#f5c2e7"
red = "#f38ba8"
warning = "#f9e2af"
fg_dim = "#9399b2"
