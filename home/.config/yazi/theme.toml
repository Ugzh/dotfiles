# Generated by apply-theme from ~/.config/theme/current.env.

[app]
overall = { bg = "#1e1e2e" }

[mgr]
cwd = { fg = "#cba6f7", bold = true }
find_keyword = { fg = "#1e1e2e", bg = "#f9e2af", bold = true }
find_position = { fg = "#f5c2e7", italic = true }
symlink_target = { fg = "#89b4fa", italic = true }
marker_copied = { fg = "#a6e3a1", bg = "#a6e3a1" }
marker_cut = { fg = "#f38ba8", bg = "#f38ba8" }
marker_marked = { fg = "#f5c2e7", bg = "#f5c2e7" }
marker_selected = { fg = "#b4befe", bg = "#b4befe" }
count_copied = { fg = "#1e1e2e", bg = "#a6e3a1", bold = true }
count_cut = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
count_selected = { fg = "#1e1e2e", bg = "#b4befe", bold = true }
border_symbol = "│"
border_style = { fg = "#6c7086" }

[indicator]
parent = { fg = "#9399b2", bg = "#181825" }
current = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
preview = { fg = "#1e1e2e", bg = "#b4befe", bold = true }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#9399b2", bg = "#181825" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
normal_alt = { fg = "#cba6f7", bg = "#313244" }
select_main = { fg = "#1e1e2e", bg = "#b4befe", bold = true }
select_alt = { fg = "#b4befe", bg = "#313244" }
unset_main = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }
unset_alt = { fg = "#f38ba8", bg = "#313244" }

[status]
overall = { fg = "#9399b2", bg = "#181825" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#b4befe" }
perm_read = { fg = "#a6e3a1" }
perm_write = { fg = "#f9e2af" }
perm_exec = { fg = "#f38ba8" }
perm_sep = { fg = "#6c7086" }
progress_label = { fg = "#cdd6f4", bold = true }
progress_normal = { fg = "#a6e3a1", bg = "#313244" }
progress_error = { fg = "#f38ba8", bg = "#313244" }

[which]
cols = 3
mask = { bg = "#1e1e2e" }
cand = { fg = "#cba6f7", bold = true }
rest = { fg = "#9399b2" }
desc = { fg = "#b4befe" }
separator = "  ›  "
separator_style = { fg = "#6c7086" }

[confirm]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }
body = { fg = "#cdd6f4" }
list = { fg = "#9399b2" }
btn_yes = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
btn_no = { fg = "#1e1e2e", bg = "#f38ba8", bold = true }

[spot]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }
tbl_col = { fg = "#89b4fa" }
tbl_cell = { fg = "#cdd6f4" }

[notify]
title_info = { fg = "#cba6f7" }
title_warn = { fg = "#f9e2af" }
title_error = { fg = "#f38ba8" }

[pick]
border = { fg = "#cba6f7" }
active = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#9399b2" }

[input]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }
value = { fg = "#cdd6f4" }
selected = { reversed = true }

[cmp]
border = { fg = "#cba6f7" }
active = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
inactive = { fg = "#9399b2" }
icon_file = "󰈙"
icon_folder = "󰉋"
icon_command = ""

[tasks]
border = { fg = "#cba6f7" }
title = { fg = "#cba6f7", bold = true }
hovered = { fg = "#1e1e2e", bg = "#b4befe" }

[help]
on = { fg = "#cba6f7", bold = true }
run = { fg = "#b4befe" }
desc = { fg = "#9399b2" }
hovered = { fg = "#1e1e2e", bg = "#cba6f7", bold = true }
footer = { fg = "#6c7086" }
icon_info = ""
icon_warn = ""
icon_error = ""

[filetype]
rules = [
  { mime = "image/*", fg = "#f9e2af" },
  { mime = "{audio,video}/*", fg = "#f5c2e7" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd}", fg = "#b4befe" },
  { mime = "inode/empty", fg = "#6c7086" },
  { url = "*", is = "orphan", fg = "#f38ba8", crossed = true },
  { url = "*", is = "exec", fg = "#a6e3a1" },
  { url = "*/", fg = "#89b4fa", bold = true },
  { url = "*", fg = "#cdd6f4" },
]
