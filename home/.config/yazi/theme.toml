# Obsidian Rose — shared with the desktop, Starship and Neovim.

[app]
overall = { bg = "#0d0911" }

[mgr]
cwd = { fg = "#c7f36b", bold = true }
find_keyword = { fg = "#0d0911", bg = "#e8b4ff", bold = true }
find_position = { fg = "#f15bb5", italic = true }
symlink_target = { fg = "#bda0ef", italic = true }
marker_copied = { fg = "#c7f36b", bg = "#c7f36b" }
marker_cut = { fg = "#ff6e9e", bg = "#ff6e9e" }
marker_marked = { fg = "#f15bb5", bg = "#f15bb5" }
marker_selected = { fg = "#c6a0f6", bg = "#c6a0f6" }
count_copied = { fg = "#0d0911", bg = "#c7f36b", bold = true }
count_cut = { fg = "#0d0911", bg = "#ff6e9e", bold = true }
count_selected = { fg = "#0d0911", bg = "#c6a0f6", bold = true }
border_symbol = "│"
border_style = { fg = "#643b72" }

[indicator]
parent = { fg = "#b7a7bd", bg = "#17111e" }
current = { fg = "#0d0911", bg = "#c7f36b", bold = true }
preview = { fg = "#0d0911", bg = "#c6a0f6", bold = true }
padding = { open = "▐", close = "▌" }

[tabs]
active = { fg = "#0d0911", bg = "#c7f36b", bold = true }
inactive = { fg = "#b7a7bd", bg = "#17111e" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

[mode]
normal_main = { fg = "#0d0911", bg = "#c7f36b", bold = true }
normal_alt = { fg = "#c7f36b", bg = "#251a30" }
select_main = { fg = "#0d0911", bg = "#c6a0f6", bold = true }
select_alt = { fg = "#c6a0f6", bg = "#251a30" }
unset_main = { fg = "#0d0911", bg = "#ff6e9e", bold = true }
unset_alt = { fg = "#ff6e9e", bg = "#251a30" }

[status]
overall = { fg = "#b7a7bd", bg = "#17111e" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }
perm_type = { fg = "#c6a0f6" }
perm_read = { fg = "#c7f36b" }
perm_write = { fg = "#e8b4ff" }
perm_exec = { fg = "#ff6e9e" }
perm_sep = { fg = "#643b72" }
progress_label = { fg = "#f7eff9", bold = true }
progress_normal = { fg = "#c7f36b", bg = "#251a30" }
progress_error = { fg = "#ff6e9e", bg = "#251a30" }

[which]
cols = 3
mask = { bg = "#0d0911" }
cand = { fg = "#c7f36b", bold = true }
rest = { fg = "#b7a7bd" }
desc = { fg = "#c6a0f6" }
separator = "  ›  "
separator_style = { fg = "#643b72" }

[confirm]
border = { fg = "#c6a0f6" }
title = { fg = "#c7f36b", bold = true }
body = { fg = "#f7eff9" }
list = { fg = "#b7a7bd" }
btn_yes = { fg = "#0d0911", bg = "#c7f36b", bold = true }
btn_no = { fg = "#0d0911", bg = "#ff6e9e", bold = true }

[spot]
border = { fg = "#c6a0f6" }
title = { fg = "#c7f36b", bold = true }
tbl_col = { fg = "#bda0ef" }
tbl_cell = { fg = "#f7eff9" }

[notify]
title_info = { fg = "#c7f36b" }
title_warn = { fg = "#e8b4ff" }
title_error = { fg = "#ff6e9e" }

[pick]
border = { fg = "#c6a0f6" }
active = { fg = "#0d0911", bg = "#c7f36b", bold = true }
inactive = { fg = "#b7a7bd" }

[input]
border = { fg = "#c6a0f6" }
title = { fg = "#c7f36b", bold = true }
value = { fg = "#f7eff9" }
selected = { reversed = true }

[cmp]
border = { fg = "#c6a0f6" }
active = { fg = "#0d0911", bg = "#c7f36b", bold = true }
inactive = { fg = "#b7a7bd" }
icon_file = "󰈙"
icon_folder = "󰉋"
icon_command = ""

[tasks]
border = { fg = "#c6a0f6" }
title = { fg = "#c7f36b", bold = true }
hovered = { fg = "#0d0911", bg = "#c6a0f6" }

[help]
on = { fg = "#c7f36b", bold = true }
run = { fg = "#c6a0f6" }
desc = { fg = "#b7a7bd" }
hovered = { fg = "#0d0911", bg = "#c7f36b", bold = true }
footer = { fg = "#643b72" }
icon_info = ""
icon_warn = ""
icon_error = ""

[filetype]
rules = [
  { mime = "image/*", fg = "#e8b4ff" },
  { mime = "{audio,video}/*", fg = "#f15bb5" },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd}", fg = "#c6a0f6" },
  { mime = "inode/empty", fg = "#643b72" },
  { url = "*", is = "orphan", fg = "#ff6e9e", crossed = true },
  { url = "*", is = "exec", fg = "#c7f36b" },
  { url = "*/", fg = "#bda0ef", bold = true },
  { url = "*", fg = "#f7eff9" },
]
