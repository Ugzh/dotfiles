[display]
compact = false
use_pager = true
show_title = true

[style.command_name]
foreground = { ansi = 5 }
bold = true

[style.example_text]
foreground = { ansi = 4 }

[style.example_code]
foreground = { ansi = 7 }

[style.example_variable]
foreground = { ansi = 13 }
underline = true

[updates]
auto_update = true
auto_update_interval_hours = 168
